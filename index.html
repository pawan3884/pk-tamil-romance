    <section class="hero">
      <div class="eyebrow">A PERSONAL MIXTAPE</div>
      <h1>Tamil<br><span>Romance</span></h1>
      <p class="tagline">Songs for rain, roads, memories &amp; the people who stayed.</p>

      </div>

        <span id="elapsed">0:00</span>
        <input id="seek" type="range" min="0" max="100" value="0" />
        <span id="duration">—</span>
      </div>

      <div class="controls">
        <button class="control" id="prev" aria-label="Previous">↶</button>
        <button class="play" id="play" aria-label="Play">▶</button>
        <button class="control" id="next" aria-label="Next">↷</button>
      </div>

      <div class="hint" id="hint">Tap play. Music is played through YouTube.</div>
    </section>

    <div id="yt-wrap" aria-hidden="true">
      <div id="player"></div>
    </div>
  </main>
